<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <!-- PDF Document -->
  <g transform="translate(220, 60)">
    <!-- Shadow -->
    <rect x="8" y="12" width="180" height="230" rx="12" fill="#00000015"/>
    <!-- Body -->
    <rect x="0" y="0" width="180" height="230" rx="12" fill="#e53935" stroke="#1a1a2e" stroke-width="4"/>
    <!-- Folded corner -->
    <path d="M130 0 L180 50 L130 50 Z" fill="#c62828" stroke="#1a1a2e" stroke-width="3"/>
    <path d="M130 0 L130 50" stroke="#1a1a2e" stroke-width="3"/>
    <!-- Gloss -->
    <rect x="15" y="15" width="60" height="80" rx="6" fill="#ffffff20"/>
    <!-- PDF label -->
    <rect x="30" y="70" width="70" height="28" rx="6" fill="white"/>
    <text x="65" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e" text-anchor="middle">PDF</text>
    <!-- Content lines -->
    <rect x="25" y="120" width="130" height="6" rx="3" fill="#ffffff40"/>
    <rect x="25" y="138" width="100" height="6" rx="3" fill="#ffffff30"/>
    <rect x="25" y="156" width="120" height="6" rx="3" fill="#ffffff30"/>
    <rect x="25" y="174" width="80" height="6" rx="3" fill="#ffffff20"/>
    <!-- Vibration lines -->
    <path d="M-15 40 Q-25 45 -15 50" stroke="#1a1a2e" stroke-width="2.5" fill="none"/>
    <path d="M-20 70 Q-30 75 -20 80" stroke="#1a1a2e" stroke-width="2.5" fill="none"/>
    <path d="M195 130 Q205 135 195 140" stroke="#1a1a2e" stroke-width="2.5" fill="none"/>
    <path d="M195 160 Q205 165 195 170" stroke="#1a1a2e" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Magnifying Glass -->
  <g transform="translate(360, 30)">
    <!-- Glass circle -->
    <circle cx="120" cy="120" r="85" fill="#e3f2fd" stroke="#1a1a2e" stroke-width="5"/>
    <circle cx="120" cy="120" r="70" fill="#bbdefb50" stroke="#42a5f5" stroke-width="3"/>
    <!-- Glare -->
    <ellipse cx="95" cy="95" rx="20" ry="15" fill="#ffffff60" transform="rotate(-30 95 95)"/>
    <!-- Handle -->
    <rect x="175" y="175" width="28" height="100" rx="10" fill="#795548" stroke="#1a1a2e" stroke-width="4" transform="rotate(45 189 225)"/>
    <rect x="179" y="179" width="20" height="30" rx="6" fill="#8d6e63" transform="rotate(45 189 194)"/>
    <!-- Sparkle inside glass -->
    <circle cx="100" cy="100" r="4" fill="#42a5f5"/>
    <circle cx="140" cy="90" r="3" fill="#42a5f5"/>
    <circle cx="110" cy="140" r="3.5" fill="#42a5f5"/>
  </g>

  <!-- Info bubbles -->
  <!-- Bubble 1: pages -->
  <g transform="translate(540, 40)">
    <rect x="0" y="0" width="110" height="36" rx="18" fill="#42a5f5" stroke="#1a1a2e" stroke-width="3"/>
    <text x="55" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">📄 12 pages</text>
  </g>
  <!-- Bubble 2: size -->
  <g transform="translate(560, 95)">
    <rect x="0" y="0" width="100" height="36" rx="18" fill="#66bb6a" stroke="#1a1a2e" stroke-width="3"/>
    <text x="50" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">💾 2.4 MB</text>
  </g>
  <!-- Bubble 3: author -->
  <g transform="translate(530, 150)">
    <rect x="0" y="0" width="120" height="36" rx="18" fill="#ffa726" stroke="#1a1a2e" stroke-width="3"/>
    <text x="60" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">✍️ Author</text>
  </g>

  <!-- Large i icon -->
  <g transform="translate(130, 310)">
    <circle cx="30" cy="30" r="28" fill="#1e88e5" stroke="#1a1a2e" stroke-width="4"/>
    <text x="30" y="42" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">i</text>
  </g>

  <!-- Sparkles -->
  <g fill="#ffd54f" stroke="#1a1a2e" stroke-width="1.5">
    <path d="M600 250 l5-15 5 15 15-5-15 5-5 15-5-15-15 5z"/>
    <path d="M170 30 l4-12 4 12 12-4-12 4-4 12-4-12-12 4z"/>
    <path d="M700 80 l3-10 3 10 10-3-10 3-3 10-3-10-10 3z"/>
    <path d="M650 200 l4-12 4 12 12-4-12 4-4 12-4-12-12 4z"/>
  </g>
</svg>
