<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PDF Swiss-Knife — A local PDF workspace for merging, splitting, organising, converting, and batch-processing PDF files." />
  <title>PDF Swiss-Knife — Local PDF Workspace</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Design system CSS (order matters) -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/tools.css" />
</head>
<body>

<!--
  App shell.
  The sidebar and topbar are rendered by app.js into their respective containers.
  The tool content area is populated by renderTool() on navigation.
-->
<div id="app" role="application" aria-label="PDF Swiss-Knife">

  <!-- ── Sidebar ─────────────────────────────────────────────────────── -->
  <aside id="sidebar" class="sidebar" aria-label="Navigation">
    <!-- Populated by app.js: buildSidebar() -->
    <div class="app-loading">
      <div class="spinner"></div>
    </div>
  </aside>

  <!-- ── Main area ──────────────────────────────────────────────────── -->
  <div class="main">

    <!-- Topbar -->
    <header id="topbar" class="topbar" role="banner">
      <!-- Populated by app.js: buildTopbar() -->
    </header>

    <!-- Scrollable content area -->
    <main id="tool-content" class="content" role="main" aria-live="polite">
      <!-- Populated by app.js: renderTool() -->
      <div class="content-inner">
        <div class="app-loading">
          <div class="spinner"></div>
          <span>Loading…</span>
        </div>
      </div>
    </main>

  </div><!-- /.main -->

</div><!-- /#app -->

<!--
  JavaScript modules.
  type="module" enables ES module imports and defers execution automatically.
  app.js is the entry point; it imports api.js, utils.js, and tool modules.
-->
<script type="module" src="/js/app.js"></script>

</body>
</html>
